openapi: 3.0.3
info:
  title: FlotaÁgil API
  version: 0.1.0
  description: 'API de FlotaÁgil: panel web, portal del pasajero y app del conductor.'
paths:
  /api/auth/app/refresh/:
    post:
      operationId: auth_app_refresh_create
      description: 'Rota el refresh: el anterior queda en la lista negra.'
      summary: Renovar los tokens de la app del conductor
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          description: ''
        '400':
          description: 'Datos inválidos: errores por campo.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`sesion_invalida`: el refresh no sirve (vencido, usado, de
            otro canal o usuario deshabilitado).'
  /api/auth/app/token/:
    post:
      operationId: auth_app_token_create
      summary: Iniciar sesión en la app del conductor
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionApp'
          description: ''
        '400':
          description: 'Datos inválidos: errores por campo.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`credenciales_invalidas`, `cuenta_bloqueada` o `cuenta_deshabilitada`.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`rol_no_permitido` (solo conductores).'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`throttled`: demasiados intentos desde esta IP (THROTTLE_LOGIN).'
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Deja el refresh de la cookie en la lista negra y borra la cookie.
        Responde 204 aunque no haya sesión. Exige que el navegador envíe Origin (o,
        si falta, Referer) con un origen de PANEL_ORIGENES; el navegador lo pone solo.
      summary: Cerrar sesión del panel
      tags:
      - auth
      responses:
        '204':
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Borra `refresh_panel` (Max-Age=0, Path=/api/auth/).
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`origen_no_permitido`: falta el encabezado Origin (y el Referer)
            o no está en PANEL_ORIGENES.'
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Rota el refresh (el anterior queda en la lista negra). Los tokens
        nuevos no superan el tope de la sesión. Exige que el navegador envíe Origin
        (o, si falta, Referer) con un origen de PANEL_ORIGENES; el navegador lo pone
        solo.
      summary: Renovar el access del panel con la cookie de refresh
      tags:
      - auth
      responses:
        '200':
          headers:
            Set-Cookie:
              schema:
                type: string
              description: '`refresh_panel=<refresh>; HttpOnly; SameSite=Lax; Path=/api/auth/;
                Max-Age=<segundos>` (Secure en producción). Max-Age no supera lo que
                le queda a la sesión.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`sesion_invalida` o `sesion_expirada`. No trae Set-Cookie:
            la cookie no se toca. El cliente debe tratar ambos códigos igual (volver
            al login).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`origen_no_permitido`: falta el encabezado Origin (y el Referer)
            o no está en PANEL_ORIGENES.'
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Deja el refresh en la cookie httpOnly «refresh_panel» y emite la
        sesión con su tope absoluto (JWT_SESION_MAX desde este login). Exige que el
        navegador envíe Origin (o, si falta, Referer) con un origen de PANEL_ORIGENES;
        el navegador lo pone solo.
      summary: Iniciar sesión en el panel web
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          headers:
            Set-Cookie:
              schema:
                type: string
              description: '`refresh_panel=<refresh>; HttpOnly; SameSite=Lax; Path=/api/auth/;
                Max-Age=<segundos>` (Secure en producción). Max-Age no supera lo que
                le queda a la sesión.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionPanel'
          description: ''
        '400':
          description: 'Datos inválidos: errores por campo.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`credenciales_invalidas`, `cuenta_bloqueada` o `cuenta_deshabilitada`.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`rol_no_permitido` (el conductor usa la app) u `origen_no_permitido`.'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`unsupported_media_type`: el cuerpo debe ser application/json.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`throttled`: demasiados intentos desde esta IP (THROTTLE_LOGIN).'
  /api/auth/yo/:
    get:
      operationId: auth_yo_retrieve
      summary: Usuario de la sesión actual
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioSesion'
          description: ''
        '401':
          description: Falta el access o no es válido (`token_not_valid`).
  /api/portal/{slug}/:
    get:
      operationId: portal_retrieve
      summary: Datos públicos de la empresa para el formulario
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - portal
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaPublica'
          description: ''
        '404':
          description: Empresa inexistente o inactiva
  /api/portal/{slug}/solicitudes/:
    post:
      operationId: portal_solicitudes_create
      description: Crea la reserva en PENDIENTE_CONFIRMACION. Se confirma respondiendo
        el WhatsApp (HU-20) antes de `expira_en`; si no, se cancela (RN-06).
      summary: Solicitar un viaje sin cuenta
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SolicitudRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SolicitudRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudRespuesta'
          description: ''
        '404':
          description: Empresa inexistente o inactiva
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PorIP:
                  value:
                    detail: Se enviaron demasiadas solicitudes desde esta conexión.
                      Espera un momento e intenta de nuevo.
                    code: limite_ip
                  summary: Por IP
                PorTeléfono:
                  value:
                    detail: Ya enviaste varias solicitudes con este número. Espera
                      unos minutos e intenta de nuevo.
                    code: limite_telefono
                  summary: Por teléfono
          description: 'Demasiadas solicitudes. `code`: `limite_ip` (desde la misma
            IP; con el wifi del aeropuerto muchos pasajeros la comparten) o `limite_telefono`
            (varias solicitudes con el mismo número).'
  /api/viajes/:
    get:
      operationId: viajes_list
      description: |-
        RN-13: el queryset se limita a la empresa del usuario y los registros nuevos se asignan a ella.

        Un registro de otra empresa no existe para el usuario: el detalle responde 404 y no 403,
        para no revelar que existe. `campo_empresa` permite filtrar por una relación
        (p. ej. "usuario__empresa").
      summary: Listar reservas
      parameters:
      - in: query
        name: canal
        schema:
          type: string
          enum:
          - CONVENIO
          - TELEFONO
          - WEB
          - WHATSAPP
        description: |-
          * `WEB` - Portal web
          * `WHATSAPP` - WhatsApp
          * `TELEFONO` - Teléfono
          * `CONVENIO` - Convenio
      - in: query
        name: desde
        schema:
          type: string
          format: date-time
      - in: query
        name: estado
        schema:
          type: array
          items:
            type: string
            enum:
            - ACEPTADO
            - ASIGNADO
            - CANCELADO
            - EN_CAMINO
            - EN_ZONA
            - FINALIZADO
            - PASAJERO_A_BORDO
            - PENDIENTE_CONFIRMACION
            - SOLICITADO
        description: |-
          Repetible: ?estado=A&estado=B

          * `PENDIENTE_CONFIRMACION` - Pendiente de confirmación
          * `SOLICITADO` - Solicitado
          * `ASIGNADO` - Asignado
          * `ACEPTADO` - Aceptado
          * `EN_CAMINO` - En camino
          * `EN_ZONA` - En zona
          * `PASAJERO_A_BORDO` - Pasajero a bordo
          * `FINALIZADO` - Finalizado
          * `CANCELADO` - Cancelado
        explode: true
        style: form
      - in: query
        name: fecha
        schema:
          type: string
          format: date
        description: Día de recogida
      - in: query
        name: hasta
        schema:
          type: string
          format: date-time
      - in: query
        name: ordenar
        schema:
          type: array
          items:
            type: string
            enum:
            - -creado_en
            - -recogida_en
            - creado_en
            - recogida_en
        description: |-
          Ordenamiento

          * `recogida_en` - Recogida en
          * `-recogida_en` - Recogida en (descendente)
          * `creado_en` - Creado en
          * `-creado_en` - Creado en (descendente)
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Pasajero, teléfono, dirección o número de vuelo
      - in: query
        name: sentido
        schema:
          type: string
          enum:
          - DESDE_AEROPUERTO
          - HACIA_AEROPUERTO
          - URBANO
        description: |-
          * `DESDE_AEROPUERTO` - Desde el aeropuerto
          * `HACIA_AEROPUERTO` - Hacia el aeropuerto
          * `URBANO` - Urbano
      tags:
      - reservas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedViajeList'
          description: ''
    post:
      operationId: viajes_create
      description: Queda en SOLICITADO. El vuelo solo se acepta en viajes desde el
        aeropuerto.
      summary: Ingresar una reserva
      tags:
      - reservas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViajeCrearRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ViajeCrearRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ViajeCrearRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDetalle'
          description: ''
  /api/viajes/{id}/:
    get:
      operationId: viajes_retrieve
      description: |-
        RN-13: el queryset se limita a la empresa del usuario y los registros nuevos se asignan a ella.

        Un registro de otra empresa no existe para el usuario: el detalle responde 404 y no 403,
        para no revelar que existe. `campo_empresa` permite filtrar por una relación
        (p. ej. "usuario__empresa").
      summary: Detalle de una reserva con su historial
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este viaje.
        required: true
      tags:
      - reservas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDetalle'
          description: ''
    patch:
      operationId: viajes_partial_update
      description: |-
        RN-13: el queryset se limita a la empresa del usuario y los registros nuevos se asignan a ella.

        Un registro de otra empresa no existe para el usuario: el detalle responde 404 y no 403,
        para no revelar que existe. `campo_empresa` permite filtrar por una relación
        (p. ej. "usuario__empresa").
      summary: Editar una reserva antes del despacho
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este viaje.
        required: true
      tags:
      - reservas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedViajeEditarRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedViajeEditarRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedViajeEditarRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDetalle'
          description: ''
        '409':
          description: La reserva no admite la operación en su estado actual
  /api/viajes/{id}/cancelar/:
    post:
      operationId: viajes_cancelar_create
      description: |-
        RN-13: el queryset se limita a la empresa del usuario y los registros nuevos se asignan a ella.

        Un registro de otra empresa no existe para el usuario: el detalle responde 404 y no 403,
        para no revelar que existe. `campo_empresa` permite filtrar por una relación
        (p. ej. "usuario__empresa").
      summary: Cancelar una reserva con motivo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este viaje.
        required: true
      tags:
      - reservas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelarRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelarRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeDetalle'
          description: ''
        '409':
          description: La reserva no admite la operación en su estado actual
components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    ActorEnum:
      enum:
      - CONDUCTOR
      - DESPACHADOR
      - ADMINISTRADOR
      - PASAJERO
      - SISTEMA
      type: string
      description: |-
        * `CONDUCTOR` - Conductor
        * `DESPACHADOR` - Despachador
        * `ADMINISTRADOR` - Administrador
        * `PASAJERO` - Pasajero
        * `SISTEMA` - Sistema
    BlankEnum:
      enum:
      - ''
    CanalEnum:
      enum:
      - WEB
      - WHATSAPP
      - TELEFONO
      - CONVENIO
      type: string
      description: |-
        * `WEB` - Portal web
        * `WHATSAPP` - WhatsApp
        * `TELEFONO` - Teléfono
        * `CONVENIO` - Convenio
    CanalPanelEnum:
      enum:
      - TELEFONO
      - WHATSAPP
      - CONVENIO
      type: string
      description: |-
        * `TELEFONO` - TELEFONO
        * `WHATSAPP` - WHATSAPP
        * `CONVENIO` - CONVENIO
    CancelarRequest:
      type: object
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - motivo
    ConductorResumen:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
      required:
      - id
      - nombre
    ConvenioResumen:
      type: object
      properties:
        id:
          type: integer
        cliente_nombre:
          type: string
      required:
      - cliente_nombre
      - id
    EmpresaPublica:
      type: object
      properties:
        razon_social:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 50
        anticipacion_minima_min:
          type: integer
        expiracion_verificacion_min:
          type: integer
        margen_nacional_min:
          type: integer
          description: Minutos que se suman a la llegada del vuelo cuando no se indica
            la recogida (RN-17).
      required:
      - anticipacion_minima_min
      - expiracion_verificacion_min
      - margen_nacional_min
      - razon_social
      - slug
    EmpresaResumen:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        razon_social:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 50
      required:
      - id
      - razon_social
      - slug
    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - code
      - detail
    EstadoViajeEnum:
      enum:
      - PENDIENTE_CONFIRMACION
      - SOLICITADO
      - ASIGNADO
      - ACEPTADO
      - EN_CAMINO
      - EN_ZONA
      - PASAJERO_A_BORDO
      - FINALIZADO
      - CANCELADO
      type: string
      description: |-
        * `PENDIENTE_CONFIRMACION` - Pendiente de confirmación
        * `SOLICITADO` - Solicitado
        * `ASIGNADO` - Asignado
        * `ACEPTADO` - Aceptado
        * `EN_CAMINO` - En camino
        * `EN_ZONA` - En zona
        * `PASAJERO_A_BORDO` - Pasajero a bordo
        * `FINALIZADO` - Finalizado
        * `CANCELADO` - Cancelado
    EstadoVueloEnum:
      enum:
      - PROGRAMADO
      - DEMORADO
      - ATERRIZADO
      - CANCELADO
      - DESVIADO
      type: string
      description: |-
        * `PROGRAMADO` - Programado
        * `DEMORADO` - Demorado
        * `ATERRIZADO` - Aterrizado
        * `CANCELADO` - Cancelado
        * `DESVIADO` - Desviado
    Historial:
      type: object
      properties:
        estado_anterior:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/EstadoViajeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        estado_nuevo:
          $ref: '#/components/schemas/EstadoViajeEnum'
        actor:
          $ref: '#/components/schemas/ActorEnum'
        usuario:
          type: string
          readOnly: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - creado_en
      - estado_nuevo
      - usuario
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 120
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    NullEnum:
      enum:
      - null
    OrigenCancelacionEnum:
      enum:
      - PASAJERO
      - DESPACHADOR
      - ADMINISTRADOR
      - SUPERVISOR
      - SISTEMA
      type: string
      description: |-
        * `PASAJERO` - Pasajero
        * `DESPACHADOR` - Despachador
        * `ADMINISTRADOR` - Administrador
        * `SUPERVISOR` - Supervisor de convenio
        * `SISTEMA` - Sistema
    PaginatedViajeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Viaje'
    PasajeroEntradaRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        telefono:
          type: string
          minLength: 1
          description: WhatsApp en formato E.164, p. ej. +56912345678.
          maxLength: 24
      required:
      - nombre
      - telefono
    PasajeroResumen:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        telefono:
          type: string
      required:
      - id
      - nombre
      - telefono
    PatchedViajeEditarRequest:
      type: object
      properties:
        sentido:
          $ref: '#/components/schemas/SentidoEnum'
        origen_dir:
          type: string
          minLength: 1
          maxLength: 200
        destino_dir:
          type: string
          minLength: 1
          maxLength: 200
        recogida_en:
          type: string
          format: date-time
        tarifa:
          type: integer
          minimum: 0
          nullable: true
        vuelo:
          allOf:
          - $ref: '#/components/schemas/VueloEntradaRequest'
          nullable: true
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RolEnum:
      enum:
      - ADMINISTRADOR
      - DESPACHADOR
      - CONDUCTOR
      type: string
      description: |-
        * `ADMINISTRADOR` - Administrador
        * `DESPACHADOR` - Despachador
        * `CONDUCTOR` - Conductor
    SentidoEnum:
      enum:
      - DESDE_AEROPUERTO
      - HACIA_AEROPUERTO
      - URBANO
      type: string
      description: |-
        * `DESDE_AEROPUERTO` - Desde el aeropuerto
        * `HACIA_AEROPUERTO` - Hacia el aeropuerto
        * `URBANO` - Urbano
    SesionApp:
      type: object
      properties:
        access:
          type: string
        usuario:
          $ref: '#/components/schemas/UsuarioSesion'
        refresh:
          type: string
      required:
      - access
      - refresh
      - usuario
    SesionPanel:
      type: object
      properties:
        access:
          type: string
        usuario:
          $ref: '#/components/schemas/UsuarioSesion'
      required:
      - access
      - usuario
    SolicitudRequest:
      type: object
      description: 'HU-19: solicitud de viaje sin cuenta.'
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 80
        telefono:
          type: string
          minLength: 1
          description: WhatsApp en formato E.164, p. ej. +56912345678.
          maxLength: 24
        origen_dir:
          type: string
          minLength: 1
          maxLength: 200
        destino_dir:
          type: string
          minLength: 1
          maxLength: 200
        recogida_en:
          type: string
          format: date-time
          nullable: true
          description: 'Obligatoria, salvo en viajes desde el aeropuerto con vuelo:
            ahí se calcula si no viene.'
        sentido:
          allOf:
          - $ref: '#/components/schemas/SentidoEnum'
          description: |-
            Si no viene: DESDE_AEROPUERTO cuando hay vuelo, URBANO si no.

            * `DESDE_AEROPUERTO` - Desde el aeropuerto
            * `HACIA_AEROPUERTO` - Hacia el aeropuerto
            * `URBANO` - Urbano
        vuelo:
          allOf:
          - $ref: '#/components/schemas/VueloLlegadaRequest'
          description: Solo para viajes desde el aeropuerto.
        acepta_privacidad:
          type: boolean
        acepta_whatsapp:
          type: boolean
        sitio_web:
          type: string
          writeOnly: true
      required:
      - acepta_privacidad
      - acepta_whatsapp
      - destino_dir
      - nombre
      - origen_dir
      - telefono
    SolicitudRespuesta:
      type: object
      properties:
        estado:
          type: string
        recogida_en:
          type: string
          format: date-time
        expira_en:
          type: string
          format: date-time
          description: Plazo para confirmar por WhatsApp (RN-06).
        mensaje:
          type: string
      required:
      - estado
      - expira_en
      - mensaje
      - recogida_en
    Tokens:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    Ubicacion:
